<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <defs>
    <linearGradient id="lrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f6ac00"/>
      <stop offset="70%" stop-color="#df9b00"/>
      <stop offset="100%" stop-color="#ffd56b"/>
    </linearGradient>
    <radialGradient id="lrGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#004d25"/>
      <stop offset="75%" stop-color="#002d15"/>
      <stop offset="100%" stop-color="#001a0c"/>
    </radialGradient>
    <filter id="lrShadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#lrShadow)">
    <ellipse cx="80" cy="45" rx="76" ry="40" fill="url(#lrGreen)" stroke="url(#lrGold)" stroke-width="4"/>
    <ellipse cx="80" cy="45" rx="70" ry="34" fill="none" stroke="url(#lrGold)" stroke-width="1.2" opacity="0.6"/>
    
    <!-- LAND text -->
    <text x="80" y="38" fill="url(#lrGold)" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="3">LAND</text>
    
    <!-- ROVER text -->
    <text x="80" y="58" fill="url(#lrGold)" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="3">ROVER</text>
    
    <!-- Accent lines -->
    <line x1="28" y1="44" x2="42" y2="44" stroke="url(#lrGold)" stroke-width="1.5"/>
    <line x1="118" y1="44" x2="132" y2="44" stroke="url(#lrGold)" stroke-width="1.5"/>
  </g>
</svg>
