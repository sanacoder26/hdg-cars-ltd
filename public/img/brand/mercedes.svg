<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mbChromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#dce1e6"/>
      <stop offset="80%" stop-color="#9aa2ab"/>
      <stop offset="100%" stop-color="#555d66"/>
    </linearGradient>
    <linearGradient id="mbChromeDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e7680"/>
      <stop offset="50%" stop-color="#a8b0ba"/>
      <stop offset="100%" stop-color="#3d444d"/>
    </linearGradient>
    <linearGradient id="mbRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9edf2"/>
      <stop offset="35%" stop-color="#9099a4"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4f5660"/>
    </linearGradient>
    <filter id="mbShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#mbShadow)">
    <!-- Outer Ring -->
    <circle cx="60" cy="60" r="52" fill="none" stroke="url(#mbRingGrad)" stroke-width="5"/>
    <circle cx="60" cy="60" r="49" fill="none" stroke="#2b313a" stroke-width="0.8" opacity="0.4"/>
    <circle cx="60" cy="60" r="54.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>

    <!-- 3-Pointed Star -->
    <!-- Top point (0 deg) -->
    <polygon points="60,60 60,12 55,54" fill="url(#mbChromeLight)"/>
    <polygon points="60,60 60,12 65,54" fill="url(#mbChromeDark)"/>

    <!-- Bottom-right point (120 deg) -->
    <!-- 60 + 48*cos(30) = 60 + 41.5 = 101.5, 60 + 48*sin(30) = 60 + 24 = 84 -->
    <polygon points="60,60 101.5,84 62,65" fill="url(#mbChromeLight)"/>
    <polygon points="60,60 101.5,84 68,57" fill="url(#mbChromeDark)"/>

    <!-- Bottom-left point (240 deg) -->
    <!-- 60 - 41.5 = 18.5, 84 -->
    <polygon points="60,60 18.5,84 58,65" fill="url(#mbChromeDark)"/>
    <polygon points="60,60 18.5,84 52,57" fill="url(#mbChromeLight)"/>
    
    <!-- Center junction jewel -->
    <circle cx="60" cy="60" r="2.5" fill="#e8edf2"/>
  </g>
</svg>
