<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <defs>
    <linearGradient id="volvoSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d4d9de"/>
      <stop offset="70%" stop-color="#8c95a0"/>
      <stop offset="100%" stop-color="#4f5661"/>
    </linearGradient>
    <filter id="volvoShadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#volvoShadow)">
    <!-- Arrow pointing up-right (45 deg) -->
    <path d="M96 28 L122 6 L122 24 L114 24 L114 18 L104 28 Z" fill="url(#volvoSilver)"/>
    <polygon points="106,8 126,8 126,28 116,18 100,34 92,26 108,10" fill="url(#volvoSilver)"/>
    
    <!-- Circular Ring -->
    <circle cx="65" cy="65" r="48" fill="none" stroke="url(#volvoSilver)" stroke-width="10"/>
    <circle cx="65" cy="65" r="43" fill="none" stroke="#252a32" stroke-width="0.8" opacity="0.3"/>
    <circle cx="65" cy="65" r="53" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>

    <!-- Blue bar -->
    <rect x="18" y="52" width="94" height="26" fill="#002b66" rx="2"/>
    <rect x="18" y="52" width="94" height="26" fill="none" stroke="url(#volvoSilver)" stroke-width="1.2" rx="2"/>

    <!-- VOLVO text -->
    <text x="65" y="71" fill="#ffffff" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="17" text-anchor="middle" letter-spacing="3">VOLVO</text>
  </g>
</svg>
